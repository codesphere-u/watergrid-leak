name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev
      - name: Run ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src tests
      - name: Run mypy
        run: uv run --python ${{ matrix.python-version }} mypy src
      - name: Run pytest
        run: uv run --python ${{ matrix.python-version }} pytest -v
